[package]
name = "axagent-providers"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axagent-harness = { path = "../harness" }
axagent-kit = { path = "../kit" }
futures = "0.3"
reqwest = { workspace = true, features = ["stream", "socks", "rustls", "multipart"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
# 信任锚用系统信任库：webpki-roots 0.26 线已无该判据的修复版（RUSTSEC-2026-0381，0.26.11 是该线最后一版）
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
computer-use = ["axagent-kit/computer-use"]
