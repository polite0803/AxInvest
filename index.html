<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./icons/bocha.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 与默认主题 deep-dusk 的 --bg 一致（oklch(17% 0.008 55)） -->
    <meta name="theme-color" content="#120f0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>AxInvest</title>
    <style>
      /* 首屏占位：dev 模式要按需转换 1300+ 模块，期间 #root 为空会呈现纯黑/纯白，
         容易被误判为“卡死”。这里给一个纯 CSS 的加载态，React 挂载后由 createRoot
         覆盖掉 #root 内容，无需任何 JS 清理。
         注意 CSP：style-src 允许 unsafe-inline，script-src 不允许 ⇒ 只能用 CSS，不能用内联脚本
         （原先那段靠内联脚本设置 body 背景色的代码实际被 CSP 全部拦掉，从未生效）。 */
      /* 首屏占位跟随应用主题，不跟随系统偏好：应用默认 themeMode=dark，而用户
         设置在 React 挂载前拿不到（存在后端库、不在 localStorage，且 CSP 禁用内联
         脚本）。用 prefers-color-scheme 会让浅色系统的机器先白后黑闪一次。
         这里直接写默认档 deep-dusk 的 --bg（oklch(17% 0.008 55) = #120f0c）。 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120f0c;
      }
      #boot-placeholder {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        color: #6d6863;
        background: inherit;
        user-select: none;
      }
      #boot-placeholder .ring {
        width: 22px;
        height: 22px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: boot-spin 700ms linear infinite;
      }
      #boot-placeholder .tip {
        letter-spacing: 0.04em;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root"><div id="boot-placeholder">
        <div class="ring"></div>
        <div class="tip">AxInvest 正在加载…</div>
      </div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
