<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OPC 内容媒体</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 16px; font-size: 13px; line-height: 1.6; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      h2 { font-size: 14px; margin: 20px 0 8px; }
      section { margin-bottom: 16px; }
      label { display: block; margin: 8px 0 4px; }
      input, textarea { padding: 6px 8px; min-width: 220px; box-sizing: border-box; }
      textarea { min-height: 72px; width: 100%; max-width: 560px; }
      button { padding: 6px 12px; margin-right: 8px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { border-bottom: 1px solid #8884; padding: 6px 8px; text-align: left; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
      .state { color: #888; }
      .error { color: #d4380d; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>OPC 内容媒体</h1>
    <div class="grid">
      <section>
        <h2>新建博客</h2>
        <form id="blog-form">
          <label for="blog-title">标题</label>
          <input id="blog-title" required />
          <label for="blog-slug">路径</label>
          <input id="blog-slug" required />
          <label for="blog-excerpt">摘要</label>
          <input id="blog-excerpt" required />
          <label for="blog-content">正文</label>
          <textarea id="blog-content" required></textarea>
          <div style="margin-top: 8px"><button type="submit">创建博客</button></div>
        </form>
        <p id="blog-state" class="state" role="status"></p>
      </section>
      <section>
        <h2>内容资产</h2>
        <form id="asset-form">
          <label for="asset-title">标题</label>
          <input id="asset-title" required />
          <label for="asset-type">类型</label>
          <input id="asset-type" value="article" required />
          <label for="asset-body">正文</label>
          <textarea id="asset-body" required></textarea>
          <div style="margin-top: 8px"><button type="submit">创建内容资产</button></div>
        </form>
        <p id="asset-create-state" class="state" role="status"></p>
      </section>
    </div>
    <section>
      <h2>博客列表</h2>
      <p id="blog-list-state" class="state" role="status">加载中…</p>
      <table id="blog-posts" hidden>
        <thead><tr><th>标题</th><th>路径</th><th>状态</th><th>浏览数</th><th>更新时间</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>内容资产列表</h2>
      <p id="asset-list-state" class="state" role="status">加载中…</p>
      <table id="content-assets" hidden>
        <thead><tr><th>标题</th><th>类型</th><th>状态</th><th>标签</th><th>创建时间</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <section>
      <h2>发布计划</h2>
      <form id="schedule-form">
        <label for="schedule-type">关联类型</label>
        <input id="schedule-type" value="content_asset" required />
        <label for="schedule-id">关联 ID</label>
        <input id="schedule-id" required />
        <label for="schedule-time">计划时间</label>
        <input id="schedule-time" type="datetime-local" required />
        <div style="margin-top: 8px"><button type="submit">创建发布计划</button></div>
      </form>
      <p id="schedule-create-state" class="state" role="status"></p>
      <p id="schedule-list-state" class="state" role="status">加载中…</p>
      <table id="publish-schedules" hidden>
        <thead><tr><th>关联</th><th>状态</th><th>计划时间</th><th>发布时间</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
    <script src="./bundle.js"></script>
  </body>
</html>
