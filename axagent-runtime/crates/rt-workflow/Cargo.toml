[package]
name = "axagent-rt-workflow"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
axagent-crypto = { version = "3.0.0", path = "../../../axagent-infra/crates/crypto" }
axagent-dao = { version = "3.0.0", path = "../../../axagent-infra/crates/dao" }
axagent-harness = { version = "3.0.0", path = "../../../axagent-core/crates/harness" }
axagent-kit = { version = "3.0.0", path = "../../../axagent-kit/crates/kit" }
axagent-providers = { version = "3.0.0", path = "../../../axagent-ai/crates/providers" }
axagent-telemetry = { version = "3.0.0", path = "../../../axagent-infra/crates/telemetry" }
chrono = { workspace = true }
chrono-tz = "0.10"
futures = "0.3"
parking_lot = "0.12"
rand = "0.10"
rhai = { version = "1", features = ["sync"] }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }

cron = "0.17"
hex = { workspace = true }
hmac = "0.13"
jsonschema = "0.47"
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "hostname",
  "smtp-transport",
  "tokio1",
  "tokio1-rustls",
  "rustls-tls",
] }
regex = "1"
reqwest = { workspace = true }
sha2 = { workspace = true }
subtle = "2"
tiny_http = "0.12"

[dev-dependencies]
async-trait = "0.1"
axagent-dao = { version = "3.0.0", path = "../../../axagent-infra/crates/dao" }
tokio = { workspace = true, features = ["full"] }

[lints]
