  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --prefix axagent-frontend --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck --prefix axagent-frontend
      - name: Lint
        run: npx oxlint axagent-frontend/src --max-warnings=0
      - name: Build
        run: npm run build --prefix axagent-frontend
