# Domain Pack: 地理信息（geospatial）
id: geospatial
name: "地理信息完整流程"
icon: "🗺️"
description: "地理数据分析、空间查询、地图可视化、位置服务"
version: 1
enabled: true
domain: data_analysis
capabilities:
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:WebSearch"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcCreateContentAsset"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcCreateProject"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:FileWrite"}
  # 域专属 worker 命令：由该域 Rust worker 声明，经 tool.set / opc.store 接缝复用宿主工具实现。
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGeospatialOpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGeospatialWebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGeospatialOpcCreateContentAsset"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGeospatialOpcCreateProject"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGeospatialFileWrite"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGeospatialRunAutomationRules"}