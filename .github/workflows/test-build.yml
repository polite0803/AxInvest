name: Test Build

on:
  push:
    tags:
      - 'test-v*.*.*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AXAGENT_PLUGIN_REPOS_ROOT: ${{ github.workspace }}/.plugin-repos

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  test-build:
    name: Test Build (aarch64-apple-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          submodules: recursive

      # 插件源码唯一权威位置：17 个独立仓按 scripts/lib/plugin-sources.json 钉版检出。
      # 主仓不再携带插件源码副本；缺仓即失败，禁止回退主仓路径。
      - name: Checkout plugin repos (pinned)
        uses: ./.github/actions/checkout-plugin-repos
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: 'macos-latest-aarch64-apple-darwin'
          workspaces: src-tauri -> target

      - name: Install Protoc
        run: brew install protobuf

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # 使用npm包替代本地构建的依赖

      - name: Install frontend dependencies
        run: npm install

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0.5
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: '-'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AxInvest ${{ github.ref_name }} (Test)'
          releaseBody: 'Internal test build for scrollbar fix verification.'
          releaseDraft: true
          prerelease: true
          tauriScript: npm run tauri
          args: --target aarch64-apple-darwin