<!doctype html>
<!--
  股票插件的 bundle 页面（B2 垂直切片）。

  本页只装载构建产物 `bundle.js`：真正的桥客户端以 TS 源码 vendored 在插件仓
  （vendor/sdk/ 三件套），由 esbuild 连同页面入口 src-web/main.ts 一起打成单文件 iife。
  页面本身**不内联任何协议帧 / 命令白名单 / ready / dispose 逻辑**——那些都只有
  vendored 桥一份来源，内联即成为第二份副本（章程明令禁止）。

  入口契约（PluginPageHost）：bundle 顶层创建客户端并 announceReady()、卸载调 dispose()；
  iframe sandbox="allow-scripts"，页面只经桥 postMessage 与宿主通信，不碰 Tauri IPC。

  装载契约见 `axagent-plugins/crates/plugins/src/types.rs` 的 `PluginPage`：
  `entry` 是相对安装目录的资产路径，宿主只认 `(pluginId, pageId)`，前端不自行拼路径。
-->
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>股票插件</title>
  </head>
  <body style="margin:0;padding:16px;font:13px/1.6 system-ui,sans-serif;color:inherit">
    <h1 style="margin:0 0 8px;font-size:16px">股票插件 · 数据切片</h1>
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
