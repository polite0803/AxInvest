# Domain Pack: 游戏开发（game_dev）
id: game_dev
name: "游戏开发完整流程"
icon: "🎮"
description: "游戏设计、关卡设计、数值平衡、游戏测试"
version: 1
enabled: true
domain: ai_media
capabilities:
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:WebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:FileWrite"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:FileRead"}
  # 域专属 worker 命令（统一插件规范试点）：由 plugin-opc-game-dev 声明，
  # 经 tool.set / opc.store 接缝复用宿主工具实现，不把实现搬进 worker。
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGameDevWebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGameDevFileWrite"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGameDevFileRead"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcGameDevRunAutomationRules"}