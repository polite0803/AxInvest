[package]
name = "axagent-company-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# P3 公司运行时内核（AxInvest 本地，implementor）
# 依赖基座既有能力（rt-workflow DAG / trajectory RL / rt-messaging 渠道 / harness DTO），
# 在其上实现 OpenOPC 三机制：Self-Built（组织/招聘）/ Self-Run（WorkItem 状态机）/ Self-Grown（经验闭环）。
# 依赖方向：implementor 可依赖 harness + entities + dao + opc-entities + trajectory；不依赖 consumer。

[dependencies]
async-trait = "0.1"
# 2026-11-05（任务 #36，PLAN §0.10.1 桶②）：原 `axagent-analysis-engine` 边已删 —— 本 crate
# 全树对它零代码引用（仅 `self_improving.rs` 注释里提到 `StockAnalysisRound` 样板），
# 却被 audit-l1-blockers 记成一条「OPC crate → 股票 crate」构建边。
# 迁入 `analysis-engine/src/opc/` 时也不需加回：该子树不引用 analysis-engine 的股票模块（只依赖 harness / entities）。
axagent-entities = { version = "3.0.0", path = "../../../axagent-core/crates/entities" }
axagent-harness = { version = "3.0.0", path = "../../../axagent-core/crates/harness" }
chrono = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axagent-dao = { version = "3.0.0", path = "../../../axagent-infra/crates/dao" }
tokio = { workspace = true, features = ["full"] }
