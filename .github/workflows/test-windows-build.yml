name: Test Windows Build

on:
  push:
    tags:
      - 'test-windows-v*.*.*'

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: 'v1'
          key: 'windows-latest-x86_64-pc-windows-msvc'
          workspaces: src-tauri -> target

      - name: Install Protoc
        run: |
          $ver = '27.3'
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$ver/protoc-$ver-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:RUNNER_TOOL_CACHE\protoc"
          echo "$env:RUNNER_TOOL_CACHE\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0.5
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AxInvest Test ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: true
          tauriScript: npm run tauri
          args: --target x86_64-pc-windows-msvc

      - name: Package Windows portable (zip)
        shell: pwsh
        run: |
          # 主二进制名解析：tauri.conf.json 的 mainBinaryName 生效时为 AxInvest.exe，
          # 否则回退到 cargo [[bin]] name（axagent.exe）。找不到就打印目录再失败，
          # 避免只在 CI 里留下一句 "path does not exist"。
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $exe = @("AxInvest.exe", "axagent.exe", "AxAgent.exe") |
            ForEach-Object { Join-Path $releaseDir $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "No built executable found under: $releaseDir"
            Get-ChildItem -Path $releaseDir -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }

          Write-Host "Packaging $exe ($([math]::Round((Get-Item $exe).Length / 1MB, 1)) MB)"

          $staging = "portable-staging-x64"
          $staged = Join-Path $staging "AxInvest.exe"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path $exe -Destination $staged -Force
          $zipName = "AxInvest_${{ github.ref_name }}_windows-x64-portable.zip"
          Compress-Archive -Path $staged -DestinationPath $zipName
          Remove-Item -Recurse -Force $staging

      - name: Upload Windows portable to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          files: AxInvest_${{ github.ref_name }}_windows-x64-portable.zip
