# Domain Pack: 安全合规（security）
id: security
name: "安全合规完整流程"
icon: "🛡️"
description: "安全审计、合规检查、风险评估、安全策略"
version: 1
enabled: true
domain: devops
capabilities:
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:WebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:FileWrite"}
  # 域专属 worker 命令：由该域 Rust worker 声明，经 tool.set / opc.store 接缝复用宿主工具实现。
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcSecurityOpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcSecurityWebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcSecurityFileWrite"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcSecurityRunAutomationRules"}