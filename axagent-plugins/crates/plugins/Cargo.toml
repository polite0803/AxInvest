[package]
name = "axagent-plugins"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
axagent-harness = { version = "3.0.0", path = "../../../axagent-core/crates/harness" }
axagent-plugin-proto = { version = "3.0.0", path = "../../../axagent-core/crates/plugin-proto" }
flate2 = "1.0"
futures = "0.3"
hex = { workspace = true }
parking_lot = "0.12"
reqwest = { version = "0.13", features = ["json", "gzip", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { workspace = true }
sysinfo = "0.39"
tar = "0.4"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# SDK 契约钉版（2026-11-22）：17 个业务插件迁出主仓后，SDK 权威快照留在本 workspace。
# 宿主测试是「宿主与插件两侧用同一份 SDK」的本地证据（见 tests/sdk_contract_pin_test.rs）。
[dev-dependencies]
axagent-plugin-opc-core = { version = "3.0.0", path = "../plugin-opc-core" }
axagent-plugin-testkit = { version = "3.0.0", path = "../plugin-testkit" }

[lints]
workspace = true
