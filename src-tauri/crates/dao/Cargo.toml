[package]
name = "axagent-dao"
version.workspace = true
edition.workspace = true
publish = false

[dev-dependencies]
sea-orm = { workspace = true }
tokio = { workspace = true }
# examples/ 探针需要它才能让 `tracing::warn!` 真正落地 ——
# 否则「失败可见」这条验收判据无法观测（探针第一次跑就踩到：注入失败后 stderr 里什么也没有）。
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dependencies]
async-trait = "0.1"
axagent-entities = { path = "../entities" }
axagent-harness = { path = "../harness" }
chrono = { workspace = true }
dirs = "6"
hex = { workspace = true }
parking_lot = "0.12"
reqwest = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.11"
subtle = "2"
tokio = { workspace = true }
toml_edit = "0.25"
tracing = { workspace = true }
uuid = { workspace = true }
walkdir = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mobile)"] }
