# SPDX-License-Identifier: AGPL-3.0-only
# 股票域插件 worker（B4 打包骨架）。
#
# 角色：**插件侧可执行**，不入 harness 分层（consumer / implementor / hybrid / wiring 那套
# 判的是 axagent-* 库 crate 之间的依赖方向；本 crate 是「被宿主 spawn 的对端进程」）。
# 依赖只允许 foundation：当前仅 `axagent-plugin-proto`（帧协议 + 声明类型），
# 后续 B4 搬入域逻辑时按 §64.11 走接缝（`market.quote` / `trading.engine` …），
# **不得**反向依赖 `axagent`（主壳）或 `axagent-plugins`（宿主侧运行时）。

[package]
name = "axagent-plugin-stock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "股票域插件 worker：长度前缀 JSON 帧的插件侧实现（B4 骨架）"

[[bin]]
name = "axagent-plugin-stock"
path = "src/main.rs"

[dependencies]
axagent-plugin-proto = { version = "3.0.0", path = "../../../axagent-core/crates/plugin-proto" }
axagent-stock-core = { version = "3.0.0", path = "../stock-core" }
serde_json = "1"

[lints]
workspace = true
