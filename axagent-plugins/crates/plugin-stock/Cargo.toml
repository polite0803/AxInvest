# SPDX-License-Identifier: AGPL-3.0-only
# 股票域插件 worker（B4 打包骨架）。
#
# 角色：**插件侧可执行**，不入 harness 分层（consumer / implementor / hybrid / wiring 那套
# 判的是 axagent-* 库 crate 之间的依赖方向；本 crate 是「被宿主 spawn 的对端进程」）。
# 依赖规则：本 crate 只依赖协议 SDK（`plugin-proto`）、共享契约 `harness` 与域自有
# `stock-core`，不反向依赖主壳命令或宿主运行时。worker 的本地计算纯函数随 `stock-core`
# 独立发布，避免把 `analysis-engine` 的 DAO / 实体 / 网络客户端拖进插件进程。

[package]
name = "axagent-plugin-stock"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "股票域插件 worker：长度前缀 JSON 帧的插件侧实现（B4 骨架）"

[[bin]]
name = "axagent-plugin-stock"
path = "src/main.rs"

[dependencies]
axagent-harness = { version = "3.0.0", path = "../../../axagent-core/crates/harness" }
axagent-plugin-proto = { version = "3.0.0", path = "../../../axagent-core/crates/plugin-proto" }
axagent-stock-core = { version = "3.0.0", path = "../stock-core" }
serde_json = "1"

[lints]
workspace = true
