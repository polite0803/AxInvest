# SPDX-License-Identifier: AGPL-3.0-only
# OPC（OpenOPC）域插件 worker。
#
# 角色：**插件侧可执行**，与 `plugin-stock` 同形，不入 harness 那套
# foundation / consumer / implementor / hybrid / wiring 分层（那套判的是 `axagent-*`
# **库 crate** 之间的依赖方向；本 crate 是「被宿主 spawn 的对端进程」）。
#
# 依赖规则：只依赖「协议 crate + 域自有实现」，**不得**反向依赖 `axagent`（主壳）
# 或 `axagent-plugins`（宿主侧运行时）。**不直接依赖 `axagent-dao` / `axagent-entities`**
# —— 插件不持 `DatabaseConnection`，一切落库读写都必须经宿主接缝（`call_seam`）。

[package]
name = "axagent-plugin-opc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "OPC 域插件 worker：长度前缀 JSON 帧的插件侧实现"

[[bin]]
name = "axagent-plugin-opc"
path = "src/main.rs"

[dependencies]
axagent-plugin-proto = { version = "3.0.0", path = "../../../axagent-core/crates/plugin-proto" }
serde_json = "1"

[lints]
workspace = true
