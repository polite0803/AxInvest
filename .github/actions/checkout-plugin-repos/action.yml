# SPDX-License-Identifier: AGPL-3.0-only
# 由 scripts/lib/plugin-sources.json 生成（2026-11-26）：ref 是钉死的 commit SHA，
# 不要手改；发布前 bump 清单后按本文件的步骤形态重新生成，并用
# `node scripts/check-plugin-source-pins.mjs --selftest` 校验清单 ↔ 动作逐项一致。
name: Checkout plugin repos (pinned)
description: >-
  按 scripts/lib/plugin-sources.json 的钉版 SHA，把 17 个独立插件仓检出到
  .plugin-repos/<plugin>。主仓不再携带插件源码副本；缺仓即构建失败，不回退主仓路径。
inputs:
  path:
    description: >-
      检出根目录（相对 GITHUB_WORKSPACE）。必须与各 workflow 顶层
      env.AXAGENT_PLUGIN_REPOS_ROOT 指向同一目录。
    required: false
    default: .plugin-repos
runs:
  using: composite
  steps:
    - name: Checkout stock
      uses: actions/checkout@v5
      with:
        repository: polite0803/axinvest-plugin-stock
        ref: 4f84175b0d18baa087a35a7a0c9a9ee26055fed5
        path: ${{ inputs.path }}/stock
        fetch-depth: 1
        persist-credentials: false
    - name: Checkout opc
      uses: actions/checkout@v5
      with:
        repository: polite0803/axinvest-plugin-opc
        ref: 659dd07c1feaf2cc397c13de26b2e81e73f7afe8
