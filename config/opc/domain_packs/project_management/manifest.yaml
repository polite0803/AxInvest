# Domain Pack: 项目管理（project_management）
id: project_management
name: "项目管理完整流程"
icon: "📋"
description: "项目规划、进度跟踪、风险管理、团队协作"
version: 1
enabled: true
domain: devops
capabilities:
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcCreateProject"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcAddMilestone"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcListProjects"}
  # 域专属 worker 命令：由该域 Rust worker 声明，经 tool.set / opc.store 接缝复用宿主工具实现。
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcProjectManagementOpcCreateProject"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcProjectManagementOpcAddMilestone"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcProjectManagementOpcListProjects"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcProjectManagementRunAutomationRules"}