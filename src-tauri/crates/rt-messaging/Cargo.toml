[package]
name = "axagent-rt-messaging"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = { workspace = true }
async-trait = "0.1"
axagent-crypto = { path = "../crypto" }
axagent-harness = { path = "../harness" }
axagent-kit = { path = "../kit" }
chrono = { workspace = true }
flate2 = "1"
futures = "0.3"
hex = { workspace = true }
parking_lot = "0.12"
regex = "1"
reqwest = { workspace = true, features = ["multipart", "cookies"] }
roxmltree = "0.21"
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = "0.11"
thiserror = { workspace = true }
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }
# 信任锚用系统信任库：webpki-roots 0.26 线已无该判据的修复版（RUSTSEC-2026-0381，0.26.11 是该线最后一版）
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tracing = { workspace = true }
url = "2"
uuid = { workspace = true }
# RUSTSEC-2026-0391 / -0398 / -0403 / -0410：zstd 0.13 线（zstd-safe 7.x、zstd-sys 2.0.x）已无修复版，
# 0.14.3 起带 zstd-safe ≥8.2.0 / zstd-sys ≥2.1.2 ⇒ 必须跨大版本升级（本仓只用 encode_all/decode_all）
zstd = { version = "0.14.3", features = ["experimental"] }

[lints]
workspace = true
