name: CI (Split Repos)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  core-check:
    name: Core Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - name: Cargo fmt
        run: cargo fmt --all --check --manifest-path axagent-core/Cargo.toml
      - name: Clippy
        run: cargo clippy --manifest-path axagent-core/Cargo.toml -- -D warnings
      - name: Cargo check
        run: cargo check --manifest-path axagent-core/Cargo.toml

  kit-check:
    name: Kit Checks
    runs-on: ubuntu-24.04
