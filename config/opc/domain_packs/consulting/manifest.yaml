# Domain Pack: 行业咨询（consulting）
# 行业 = 数据资产包，非代码。manifest 版本号驱动 seed/升级。
id: consulting
name: 行业咨询流程
icon: "💼"
description: 行业调研 → 方案设计 → 交付报告。CEO 视角，战略级分析。
version: 3
enabled: true
domain: data_analysis
capabilities:
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:WebSearch"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcGetDashboard"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcCreateContentAsset"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:FileWrite"}
  # 域专属 worker 命令：由该域 Rust worker 声明，经 tool.set / opc.store 接缝复用宿主工具实现。
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcConsultingOpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcConsultingWebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcConsultingOpcGetDashboard"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcConsultingOpcCreateContentAsset"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcConsultingFileWrite"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcConsultingRunAutomationRules"}