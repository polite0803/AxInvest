# Domain Pack: 品牌电商（ecommerce）
# 行业 = 数据资产包，非代码。manifest 版本号驱动 seed/升级。
id: ecommerce
name: 电商运营流程
icon: "🛍️"
description: 选品分析 → 上架落地页 → 客户管理。CPO + COO 交叉协作。
version: 2
enabled: true
domain: content_creation
capabilities:
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:WebSearch"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcSearchWiki"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcListCustomers"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcCreateContentAsset"}
  - source: tool
    capability_type: opc_tool
    predicate: {kind: id_exact, id: "tool:OpcCreateLandingPage"}
  # 域专属 worker 命令：由该域 Rust worker 声明，经 tool.set / opc.store 接缝复用宿主工具实现。
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcEcommerceWebSearch"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcEcommerceOpcSearchWiki"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcEcommerceOpcListCustomers"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcEcommerceOpcCreateContentAsset"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcEcommerceOpcCreateLandingPage"}
  - source: tool
    capability_type: general_tool
    predicate: {kind: id_exact, id: "tool:OpcEcommerceRunAutomationRules"}